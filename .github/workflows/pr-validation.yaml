name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm install
      - name: Lint HTML files
        run: npx htmlhint src/**/*.html
      - name: Lint CSS files
        run: npx stylelint "src/styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm install
      - name: Build website
        run: npx parcel build src/index.html --dist-dir build
